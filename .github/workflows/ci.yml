name: Repository quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Lint Python
        run: ruff check .

      - name: Check Python formatting
        run: ruff format --check 01_ab_testing/src 02_pre_post_analysis/src 03_target_analysis/src 04_predictive_analytics/src 05_ad_hoc_analysis/src 06_customer_value_lifecycle/src 07_marketing_experimentation/src tests

      - name: Verify Python syntax
        run: python -m compileall -q 01_ab_testing/src 02_pre_post_analysis/src 03_target_analysis/src 04_predictive_analytics/src 05_ad_hoc_analysis/src 06_customer_value_lifecycle/src 07_marketing_experimentation/src tests

      - name: Run analytical and repository tests
        run: pytest --cov --cov-report=term-missing
